version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lamadb_postgres
    environment:
      POSTGRES_USER: lamadb
      POSTGRES_PASSWORD: lamadb_secret
      POSTGRES_DB: lamadb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lamadb -d lamadb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lamadb_api
    environment:
      DATABASE_URL: postgresql://lamadb:lamadb_secret@postgres:5432/lamadb
      API_KEY_SALT: ${API_KEY_SALT:-change-me-in-production}
      LAMADB_SKIP_POLLERS: ${LAMADB_SKIP_POLLERS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      WIKI_PATH: /wiki
      UPTIME_KUMA_URL: ${UPTIME_KUMA_URL:-}
      UPTIME_KUMA_API_KEY: ${UPTIME_KUMA_API_KEY:-}
      UPTIME_KUMA_USER: ${UPTIME_KUMA_USER:-}
      UPTIME_KUMA_PASSWORD: ${UPTIME_KUMA_PASSWORD:-}
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      TAUTULLI_URL: ${TAUTULLI_URL:-}
      TAUTULLI_API_KEY: ${TAUTULLI_API_KEY:-}
      HERMES_URL: ${HERMES_URL:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMES_DASHBOARD_SESSION_TOKEN: ${HERMES_DASHBOARD_SESSION_TOKEN:-}
      FRESHRSS_URL: ${FRESHRSS_URL:-}
      FRESHRSS_USERNAME: ${FRESHRSS_USERNAME:-}
      FRESHRSS_API_PASSWORD: ${FRESHRSS_API_PASSWORD:-}
      DOZZLE_URL: ${DOZZLE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ${WIKI_PATH:-/home/messhias/Basecamp/wiki}:/wiki:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
